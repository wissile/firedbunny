# Deploys the site to the Cloudflare Worker "firedbunny" on every push to main, then checks the live site.
#
# One-time setup, in GitHub: Settings > Secrets and variables > Actions > New repository secret
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID (Workers & Pages overview, right-hand column)
# Optional repository variable (same page, Variables tab): SITE_URL, e.g. https://firedbunny.com. It is used for
# link previews and for the live-site check; without it the check uses the workers.dev address.
#
# Other branches never deploy, so unfinished work can live on a branch until it is merged into main.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      WRANGLER_VERSION: 4.151.3
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check the Cloudflare secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Not deployed::Add these repository secrets in Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The build pre-builds every page in a headless browser (tools/prerender.py): Playwright drives the runner's own
      # Google Chrome. Every address is a pre-built file, so in CI the build fails without it (nothing is deployed).
      - name: Install Playwright for the pre-built pages
        run: |
          python3 -m pip install --user --break-system-packages --quiet playwright==1.56.0 || { echo "::error title=Not deployed::Playwright did not install, so the pages cannot be pre-built."; exit 1; }

      # wrangler runs the build in wrangler.jsonc (python3 tools/build.py) and then uploads dist/ and worker/index.js.
      # IndexNow (Bing, Yandex, Seznam, Naver): remember the live sitemap before deploying, so the step after the live
      # check can announce only the pages that are new or changed. The key is public by design: it is the file
      # public/<key>.txt, which proves the site is ours.
      - name: Remember the live sitemap for IndexNow
        env:
          URL: ${{ vars.SITE_URL }}
        run: |
          [ -n "$URL" ] || exit 0
          curl -s -o old-sitemap.xml "${URL%/}/sitemap.xml" || true
          key=$(cd public && ls | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          # a query string keeps this check from leaving a cached 404 at the key's own address
          code=$(curl -s -o /dev/null -w '%{http_code}' "${URL%/}/$key.txt?pre=${GITHUB_SHA::7}" || true)
          echo "$code" > old-key-status.txt

      - name: Build and deploy
        id: deploy
        run: |
          set -o pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check the live site
        env:
          URL: ${{ vars.SITE_URL || steps.deploy.outputs.url }}
        run: |
          short=${GITHUB_SHA::7}
          if [ -z "$URL" ]; then
            echo "::warning title=Deployed $short::Deployed, but no address to check. Set the SITE_URL repository variable."
            exit 0
          fi
          URL=${URL%/}
          code=000
          # a new version takes a few seconds to reach every Cloudflare location, so retry until the page matches
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o home.html -w '%{http_code}' "$URL/?deploy=$short-$i" || true)
            [ "$code" = 200 ] && cmp -s home.html dist/index.html && break
            sleep 5
          done
          if [ "$code" != 200 ] || ! grep -q '<title>FiredBunny' home.html; then
            echo "::error title=Live site check failed::$URL/ answered $code after deploying $short"
            exit 1
          fi
          if cmp -s home.html dist/index.html; then
            echo "::notice title=Deployed $short::$URL is live and serving this commit."
          else
            echo "::warning title=Deployed $short::$URL answers, but its page differs from this build (a cache or a page rule may change it)."
          fi
          # how much a visitor downloads for the page (Cloudflare compresses it on the way)
          app=$(cd dist && ls app.*.js | head -1)
          sz=$(curl -s -o /dev/null -H 'Accept-Encoding: br, gzip' -w '%{size_download}' "$URL/" || echo 0)
          asz=$(curl -s -o /dev/null -H 'Accept-Encoding: br, gzip' -w '%{size_download}' "$URL/$app" || echo 0)
          enc=$(curl -s -o /dev/null -D - -H 'Accept-Encoding: br, gzip' "$URL/$app" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-encoding"{print $2}')
          echo "::notice title=Page size::first visit downloads $(((sz + asz) / 1024)) KB (${enc:-not compressed}): page $((sz / 1024)) KB, $app $((asz / 1024)) KB. Later visits open from the device."
          pages=$(grep -c '<loc>' dist/sitemap.xml || echo 0)
          echo "::notice title=Pre-built pages::$pages indexable pages pre-built and listed in sitemap.xml (tools/prerender.py)."
          # search: a pre-built lesson at its own address, the sitemap, robots.txt, and a real 404 for unknown addresses
          lp=$(grep -oE '<loc>https://firedbunny.com/lessons/[^<]+</loc>' dist/sitemap.xml | head -1 | sed -E 's#<loc>https://firedbunny.com##; s#</loc>##')
          lc=$(curl -s -o lesson.html -w '%{http_code}' "$URL$lp" || true)
          # the query skips any cached copy at the edge; retry while the new version spreads
          for i in 1 2 3 4 5 6; do
            sc=$(curl -s -o sitemap.xml -w '%{http_code}' "$URL/sitemap.xml?deploy=$short-$i" || true)
            [ "$sc" = 200 ] && cmp -s sitemap.xml dist/sitemap.xml && break
            sleep 5
          done
          nc=$(curl -s -o /dev/null -w '%{http_code}' "$URL/no-such-page-$short/" || true)
          if [ "$lc" = 200 ] && grep -q "rel=\"canonical\" href=\"https://firedbunny.com$lp\"" lesson.html && [ "$sc" = 200 ] && cmp -s sitemap.xml dist/sitemap.xml && [ "$nc" = 404 ] && curl -s "$URL/robots.txt" | grep -q '^Sitemap:'; then
            echo "::notice title=Search::$URL$lp answers with its own page and canonical, sitemap.xml matches this build, robots.txt lists it, and unknown addresses return 404."
          else
            echo "::warning title=Search::lesson page $lc, sitemap $sc (matches: $(cmp -s sitemap.xml dist/sitemap.xml && echo yes || echo no)), unknown address $nc (expected 200, 200, 404)."
          fi
          # offline mode: the service worker is live, and audio answers byte ranges (iPhones need them)
          swc=$(curl -s -o sw.js -w '%{http_code}' "$URL/sw.js" || true)
          if [ "$swc" = 200 ] && cmp -s sw.js dist/sw.js; then
            echo "::notice title=Offline mode::$URL/sw.js is live and matches this build."
          else
            echo "::warning title=Offline mode::$URL/sw.js answered $swc or differs from this build."
          fi
          f=$(cd dist && ls audio/lessons/*.mp4 | head -1)
          rc=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1' "$URL/$f" || true)
          if [ "$rc" = 206 ]; then
            echo "::notice title=Audio ranges::$URL/$f answers byte-range requests (206), so phones can play and seek."
          else
            echo "::warning title=Audio ranges::$URL/$f answered $rc to a byte-range request, not 206."
          fi
          # embeddable calculators: /tools/<name>/?embed may be framed by other sites and is noindex; the plain page is not
          eh=$(curl -s -D - -o /dev/null "$URL/tools/mortgage/?embed" | tr -d '\r' | tr 'A-Z' 'a-z' || true)
          ph=$(curl -s -D - -o /dev/null "$URL/tools/mortgage/" | tr -d '\r' | tr 'A-Z' 'a-z' || true)
          if ! echo "$eh" | grep -q '^x-frame-options' && echo "$eh" | grep -q '^x-robots-tag: noindex' && echo "$ph" | grep -q '^x-frame-options: sameorigin'; then
            echo "::notice title=Embeds::$URL/tools/mortgage/?embed can be framed and is noindex; the normal page stays SAMEORIGIN."
          else
            echo "::warning title=Embeds::framing headers for /tools/mortgage/?embed are not as expected."
          fi
          curl -s -o health.json "$URL/api/health" || true
          python3 - "$URL" <<'PY'
          import json, sys
          url = sys.argv[1]
          try:
              h = json.load(open('health.json'))
          except Exception:
              print(f'::warning title=Live data::{url}/api/health did not answer with data, so the earnings relay is not running.')
              sys.exit(0)
          level = 'notice' if h.get('ok') else 'warning'
          print(f"::{level} title=Live data::{h.get('verdict', '')} ({h.get('secUserAgent', '')})")
          PY

      # Announce new and changed pages to IndexNow, which Bing (and through it Copilot) uses. Compares this build's
      # sitemap with the one that was live before the deploy; the first time the key file goes live, every page is sent.
      - name: Announce changed pages (IndexNow)
        env:
          URL: ${{ vars.SITE_URL }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          [ -n "$URL" ] || { echo "::notice title=IndexNow::Skipped: SITE_URL is not set."; exit 0; }
          python3 - "${URL%/}" <<'PY'
          import json, os, re, sys, urllib.request
          url = sys.argv[1]; host = re.sub(r'^https?://', '', url)
          keys = [f[:-4] for f in os.listdir('public') if re.fullmatch(r'[0-9a-f]{32}\.txt', f)]
          if not keys:
              print('::notice title=IndexNow::Skipped: no key file in public/.'); sys.exit(0)
          key = keys[0]
          def read(p):
              try: return dict(re.findall(r'<loc>(.*?)</loc>\s*<lastmod>(.*?)</lastmod>', open(p, encoding='utf-8').read()))
              except Exception: return {}
          new, old = read('dist/sitemap.xml'), read('old-sitemap.xml')
          first = open('old-key-status.txt').read().strip() != '200' if os.path.exists('old-key-status.txt') else True
          first = first or 'indexnow-all' in os.environ.get('MSG', '')  # a commit can ask for every page to be sent again
          urls = sorted(new) if (first or not old) else sorted(u for u, d in new.items() if old.get(u) != d)
          urls = [u for u in urls if u.startswith(url + '/')][:10000]
          if not urls:
              print('::notice title=IndexNow::No new or changed pages to announce.'); sys.exit(0)
          import time
          # the key file must answer with exactly the key, or IndexNow refuses (403). Cloudflare answers 403 to Python's
          # default User-Agent, so the check sends its own.
          try:
              live_key = urllib.request.urlopen(urllib.request.Request(f'{url}/{key}.txt?check={os.environ.get("GITHUB_SHA", "")[:7]}', headers={'User-Agent': 'Mozilla/5.0 (compatible; FiredBunnyDeploy/1.0; +https://firedbunny.com)'}), timeout=20).read().decode().strip()
          except Exception as e:
              live_key = f'error: {e}'
          if live_key != key:
              print(f'::warning title=IndexNow::Skipped: {url}/{key}.txt does not answer with the key ({live_key[:60]!r}).'); sys.exit(0)
          body = json.dumps({'host': host, 'key': key, 'keyLocation': f'{url}/{key}.txt', 'urlList': urls}).encode()
          code, why = 0, ''
          for attempt in range(3):  # a key file that went live seconds ago may not be visible to IndexNow yet
              req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
              try:
                  code = urllib.request.urlopen(req, timeout=30).status; why = ''
              except urllib.error.HTTPError as e:
                  code = e.code; why = e.read().decode(errors='replace')[:200]
              except Exception as e:
                  print(f'::warning title=IndexNow::Could not reach api.indexnow.org ({e}).'); sys.exit(0)
              if code in (200, 202) or code not in (403, 429, 500, 502, 503):
                  break
              time.sleep(30)
          level = 'notice' if code in (200, 202) else 'warning'
          print(f"::{level} title=IndexNow::Sent {len(urls)} {'pages (all)' if first else 'new or changed pages'}; IndexNow answered {code}{(': ' + why) if why else ''}.")
          PY
