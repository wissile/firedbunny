name: QA probe (temporary, audit only)
# Runs only on the qa-probe branch. Reads the live site; deploys nothing.
on:
  push:
    branches: [qa-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Second pass (full lists)
        run: python3 .github/probe/qa2.py
